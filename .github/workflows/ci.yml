name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Audit redaction
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p test_audit_recap_vercel.py
  recap:
    name: Recap prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: video/recap
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: video/recap/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run fixtures
      - run: npm run typecheck && npm test && npm run test:media
      # The hosted Ubuntu image already includes Chrome's runtime libraries;
      # FFmpeg is installed above. Avoid a second apt update for the browser.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - run: npm run test:editor
      - run: npm run render -- fixtures/mixed-media.json fixtures/collection.json artifacts/ci-mixed-media.mp4
      - run: npx tsx scripts/playback.ts artifacts/ci-mixed-media.mp4
      - run: npx tsx scripts/smoke-local-evaluation.ts
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-recap-evidence
          path: |
            video/recap/artifacts/
            video/recap/test-results/
          retention-days: 7
  checks:
    name: Static and unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run ci:checks
  browser:
    name: Browser (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [dev, production]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # As in the recap job: the hosted Ubuntu image already has Chrome's runtime
      # libraries, so skip --with-deps and its apt update, which can hang on a slow mirror.
      - run: npx playwright install chromium
        timeout-minutes: 5
      - if: matrix.mode == 'dev'
        run: npm run ci:browser
      - if: matrix.mode == 'production'
        run: npm run e2e:production
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-${{ matrix.mode }}-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
